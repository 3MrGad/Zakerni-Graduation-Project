name: flutter_application_2
description: "Alzheimer Assistant - Memory Care App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ───────────────────────────────────────────────────────────
  http: ^1.2.0

  # ── Voice / AI ───────────────────────────────────────────────────────────
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

  # ── Location & Permissions ───────────────────────────────────────────────
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

  # ── Storage ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4

  # ── UI / Animations ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_animate: ^4.1.0
  simple_animations: ^5.0.2
  fl_chart: ^0.66.2
  hugeicons: ^1.1.1

  # ── Features ─────────────────────────────────────────────────────────────
  image_picker: ^1.0.4
  mobile_scanner: ^7.2.0
  url_launcher: ^6.1.10
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3

  # ── Firebase (FCM notifications) ─────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ── Maps ─────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
